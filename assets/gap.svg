<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-labelledby="t d">
<title id="t">Where did €70 go?</title>
<desc id="d">A bar for €1,000 invoiced splits into €930 received, a €50 credit for late delivery found in the client's email, and a €20 bank fee taken on the way. €1,000 minus €50 minus €20 equals €930.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1324"/><stop offset="1" stop-color="#0F1F3A"/></linearGradient>
<linearGradient id="tealgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
<pattern id="ledger" width="1280" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="1280" y2="27.5" stroke="#16243F" stroke-width="1"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C9DBA"/></marker>
<marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace}
@keyframes a1{0%,1.00%{opacity:0}2.50%,95.00%{opacity:1}96.50%,100%{opacity:0}}.a1{animation:a1 12s linear infinite}
@keyframes g2{0%,8.00%{transform:scaleX(0)}26.00%,95.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.g2{transform-box:fill-box;transform-origin:left center;animation:g2 12s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes a3{0%,24.00%{opacity:0}25.50%,95.00%{opacity:1}96.50%,100%{opacity:0}}.a3{animation:a3 12s linear infinite}
@keyframes a4{0%,34.00%{opacity:0}35.50%,95.00%{opacity:1}96.50%,100%{opacity:0}}.a4{animation:a4 12s linear infinite}
@keyframes a5{0%,46.00%{opacity:0}47.50%,95.00%{opacity:1}96.50%,100%{opacity:0}}.a5{animation:a5 12s linear infinite}
@keyframes a6{0%,60.00%{opacity:0}61.50%,95.00%{opacity:1}96.50%,100%{opacity:0}}.a6{animation:a6 12s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1280" height="384" rx="24" fill="url(#bg)"/>
<rect width="1280" height="384" rx="24" fill="url(#ledger)" opacity=".55"/>
<text x="48" y="56" class="sans" font-size="30" font-weight="800" fill="#E7EEF8" text-anchor="start" >Where did €70 go?</text>
<text x="48" y="86" class="sans" font-size="17" font-weight="400" fill="#8C9DBA" text-anchor="start" >Every gap is split into named parts that add up to the cent. Each part points to its evidence.</text>
<g class="a1"><text x="140" y="158" class="mono" font-size="15" font-weight="600" fill="#8C9DBA" text-anchor="start" >Invoiced: INV-101 €600 + INV-102 €400 = €1,000</text><rect x="140" y="176" width="1000" height="46" rx="8" fill="#22324F" fill-opacity=".6"/></g>
<rect class="g2" x="140" y="176" width="930" height="46" rx="8" fill="#2DD4BF" fill-opacity=".85"/>
<g class="a3"><text x="164" y="206" class="mono" font-size="18" font-weight="800" fill="#0A1324" text-anchor="start" >€930 received</text></g>
<g class="a4"><rect x="1070" y="176" width="50" height="46" fill="#F6B94C"/><path d="M 1095,176 L 1095,136 L 1080,136" fill="none" stroke="#F6B94C" stroke-width="1.5"/><text x="1074" y="132" class="sans" font-size="15" font-weight="700" fill="#F6B94C" text-anchor="end" >€50 credit for late delivery</text><text x="1074" y="152" class="sans" font-size="13" font-weight="400" fill="#8C9DBA" text-anchor="end" >from the client's email</text></g>
<g class="a5"><rect x="1120" y="176" width="20" height="46" rx="3" fill="#F7776E"/><path d="M 1130,222 L 1130,256 L 1100,256" fill="none" stroke="#F7776E" stroke-width="1.5"/><text x="1094" y="262" class="sans" font-size="15" font-weight="700" fill="#F7776E" text-anchor="end" >€20 bank fee taken on the way</text><text x="1094" y="282" class="sans" font-size="13" font-weight="400" fill="#8C9DBA" text-anchor="end" >inferred from the route; booked as a fee</text></g>
<g class="a6"><rect x="140" y="318" width="1000" height="44" rx="12" fill="#4ADE80" fill-opacity=".1" stroke="#4ADE80" stroke-opacity=".5"/><text x="640" y="347" class="mono" font-size="17" font-weight="700" fill="#4ADE80" text-anchor="middle" >€1,000 − €50 credit − €20 bank fee = €930   ✓ every euro accounted for</text></g>
</svg>
