<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
<title id="t">Three weeks, three layers</title>
<desc id="d">Build plan from 25 October to 13 November 2026. Week 1 builds the whole product end to end, ending 31 October with the loop working in the sandbox. Week 2 widens and tests it, ending 7 November after real users have tried it. Week 3 refines and presents it; submission on 12 November, a day before the 13 November deadline.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1324"/><stop offset="1" stop-color="#0F1F3A"/></linearGradient>
<linearGradient id="tealgrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
<pattern id="ledger" width="1280" height="28" patternUnits="userSpaceOnUse"><line x1="0" y1="27.5" x2="1280" y2="27.5" stroke="#16243F" stroke-width="1"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C9DBA"/></marker>
<marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2DD4BF"/></marker>
</defs>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Menlo, Consolas, monospace}
@keyframes g1{0%,2.00%{transform:scaleX(0)}74.00%,94.00%{transform:scaleX(1)}96.00%,100%{transform:scaleX(0)}}.g1{transform-box:fill-box;transform-origin:left center;animation:g1 12s cubic-bezier(.2,.7,.2,1) infinite}
@keyframes a2{0%,24.74%{opacity:0}26.24%,94.00%{opacity:1}95.50%,100%{opacity:0}}.a2{animation:a2 12s linear infinite}
@keyframes a3{0%,51.26%{opacity:0}52.76%,94.00%{opacity:1}95.50%,100%{opacity:0}}.a3{animation:a3 12s linear infinite}
@keyframes a4{0%,70.21%{opacity:0}71.71%,94.00%{opacity:1}95.50%,100%{opacity:0}}.a4{animation:a4 12s linear infinite}
@keyframes a5{0%,74.00%{opacity:0}75.50%,94.00%{opacity:1}95.50%,100%{opacity:0}}.a5{animation:a5 12s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1280" height="360" rx="24" fill="url(#bg)"/>
<rect width="1280" height="360" rx="24" fill="url(#ledger)" opacity=".55"/>
<text x="48" y="56" class="sans" font-size="30" font-weight="800" fill="#E7EEF8" text-anchor="start" >Three weeks, three layers</text>
<text x="48" y="86" class="sans" font-size="17" font-weight="400" fill="#8C9DBA" text-anchor="start" >The whole product works end to end by day 7. Everything after that widens it, tests it and refines it.</text>
<rect x="58" y="118" width="380" height="78" rx="14" fill="#2DD4BF" fill-opacity=".1" stroke="#2DD4BF" stroke-opacity=".55"/><text x="76" y="150" class="sans" font-size="17" font-weight="700" fill="#2DD4BF" text-anchor="start" >Week 1 · the whole product</text><text x="76" y="174" class="sans" font-size="14" font-weight="400" fill="#8C9DBA" text-anchor="start" >end to end in the sandbox</text>
<rect x="450" y="118" width="380" height="78" rx="14" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".55"/><text x="468" y="150" class="sans" font-size="17" font-weight="700" fill="#A78BFA" text-anchor="start" >Week 2 · widen it, test it hard</text><text x="468" y="174" class="sans" font-size="14" font-weight="400" fill="#8C9DBA" text-anchor="start" >every case, attacks, real users</text>
<rect x="842" y="118" width="324" height="78" rx="14" fill="#F6B94C" fill-opacity=".1" stroke="#F6B94C" stroke-opacity=".55"/><text x="860" y="150" class="sans" font-size="17" font-weight="700" fill="#F6B94C" text-anchor="start" >Week 3 · refine and present</text><text x="860" y="174" class="sans" font-size="14" font-weight="400" fill="#8C9DBA" text-anchor="start" >polish, harden, demo video</text>
<line x1="80" y1="238" x2="1144" y2="238" stroke="#22324F" stroke-width="6" stroke-linecap="round"/>
<rect class="g1" x="80" y="235" width="1064" height="6" rx="3" fill="url(#tealgrad)" filter="url(#glow)"/>
<circle cx="80" cy="238" r="3.5" fill="#8C9DBA"/><text x="80" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >25 Oct</text>
<circle cx="136" cy="238" r="3.5" fill="#8C9DBA"/><text x="136" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >26</text>
<circle cx="192" cy="238" r="3.5" fill="#8C9DBA"/><text x="192" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >27</text>
<circle cx="248" cy="238" r="3.5" fill="#8C9DBA"/><text x="248" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >28</text>
<circle cx="304" cy="238" r="3.5" fill="#8C9DBA"/><text x="304" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >29</text>
<circle cx="360" cy="238" r="3.5" fill="#8C9DBA"/><text x="360" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >30</text>
<circle cx="416" cy="238" r="3.5" fill="#8C9DBA"/><text x="416" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >31</text>
<circle cx="472" cy="238" r="3.5" fill="#8C9DBA"/><text x="472" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >1 Nov</text>
<circle cx="528" cy="238" r="3.5" fill="#8C9DBA"/><text x="528" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >2</text>
<circle cx="584" cy="238" r="3.5" fill="#8C9DBA"/><text x="584" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >3</text>
<circle cx="640" cy="238" r="3.5" fill="#8C9DBA"/><text x="640" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >4</text>
<circle cx="696" cy="238" r="3.5" fill="#8C9DBA"/><text x="696" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >5</text>
<circle cx="752" cy="238" r="3.5" fill="#8C9DBA"/><text x="752" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >6</text>
<circle cx="808" cy="238" r="3.5" fill="#8C9DBA"/><text x="808" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >7</text>
<circle cx="864" cy="238" r="3.5" fill="#8C9DBA"/><text x="864" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >8</text>
<circle cx="920" cy="238" r="3.5" fill="#8C9DBA"/><text x="920" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >9</text>
<circle cx="976" cy="238" r="3.5" fill="#8C9DBA"/><text x="976" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >10</text>
<circle cx="1032" cy="238" r="3.5" fill="#8C9DBA"/><text x="1032" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >11</text>
<circle cx="1088" cy="238" r="3.5" fill="#8C9DBA"/><text x="1088" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >12</text>
<circle cx="1144" cy="238" r="3.5" fill="#8C9DBA"/><text x="1144" y="264" class="mono" font-size="12" font-weight="500" fill="#8C9DBA" text-anchor="middle" >13 Nov</text>
<g class="a2"><rect x="407" y="229" width="18" height="18" transform="rotate(45 416 238)" fill="#2DD4BF" filter="url(#glow)"/><text x="416" y="300" class="mono" font-size="14" font-weight="700" fill="#2DD4BF" text-anchor="middle" >31 Oct</text><text x="416" y="318" class="sans" font-size="13" font-weight="500" fill="#E7EEF8" text-anchor="middle" >the whole loop works</text></g>
<g class="a3"><rect x="799" y="229" width="18" height="18" transform="rotate(45 808 238)" fill="#A78BFA" filter="url(#glow)"/><text x="808" y="300" class="mono" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle" >7 Nov</text><text x="808" y="318" class="sans" font-size="13" font-weight="500" fill="#E7EEF8" text-anchor="middle" >real users have tried it</text></g>
<g class="a4"><rect x="1079" y="229" width="18" height="18" transform="rotate(45 1088 238)" fill="#4ADE80" filter="url(#glow)"/><text x="1078" y="300" class="mono" font-size="14" font-weight="700" fill="#4ADE80" text-anchor="end" >12 Nov</text><text x="1078" y="318" class="sans" font-size="13" font-weight="500" fill="#E7EEF8" text-anchor="end" >submitted, a day early</text></g>
<g class="a5"><rect x="1135" y="229" width="18" height="18" transform="rotate(45 1144 238)" fill="#F7776E" filter="url(#glow)"/><text x="1156" y="322" class="mono" font-size="14" font-weight="700" fill="#F7776E" text-anchor="end" >13 Nov</text><text x="1156" y="340" class="sans" font-size="13" font-weight="500" fill="#E7EEF8" text-anchor="end" >deadline</text></g>
</svg>
