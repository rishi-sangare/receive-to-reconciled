<g><g class=""><rect x="253.0" y="362" width="147.0" height="30" rx="15" fill="#8C9DBA" fill-opacity=".14" stroke="#8C9DBA" stroke-opacity=".7"/><text x="326.5" y="382" class="sans" font-size="14" font-weight="600" fill="#8C9DBA" text-anchor="middle" >Fixes the cause</text></g></g>
<g class="a3" filter="url(#glow)"><g class=""><rect x="253.0" y="362" width="147.0" height="30" rx="15" fill="#A78BFA" fill-opacity=".14" stroke="#A78BFA" stroke-opacity=".7"/><text x="326.5" y="382" class="sans" font-size="14" font-weight="600" fill="#A78BFA" text-anchor="middle" >Fixes the cause</text></g></g>
<g><g class=""><rect x="412.0" y="362" width="147.0" height="30" rx="15" fill="#8C9DBA" fill-opacity=".14" stroke="#8C9DBA" stroke-opacity=".7"/><text x="485.5" y="382" class="sans" font-size="14" font-weight="600" fill="#8C9DBA" text-anchor="middle" >Moves the money</text></g></g>
<g class="a4" filter="url(#glow)"><g class=""><rect x="412.0" y="362" width="147.0" height="30" rx="15" fill="#2DD4BF" fill-opacity=".14" stroke="#2DD4BF" stroke-opacity=".7"/><text x="485.5" y="382" class="sans" font-size="14" font-weight="600" fill="#2DD4BF" text-anchor="middle" >Moves the money</text></g></g>
<rect x="700" y="52" width="520" height="336" rx="18" fill="#0E1A30" stroke="#22324F"/>
<text x="728" y="90" class="mono" font-size="13" font-weight="600" fill="#8C9DBA" text-anchor="start" letter-spacing="1.2">DEPOSIT RECEIVED · EUR</text>
<text x="1192" y="98" class="mono" font-size="34" font-weight="700" fill="#E7EEF8" text-anchor="end" >€930.00</text>
<text x="728" y="126" class="mono" font-size="18" font-weight="600" fill="#E7EEF8" text-anchor="start" >ACME HOLDING BV</text>
<text x="728" y="152" class="mono" font-size="15" font-weight="400" fill="#8C9DBA" text-anchor="start" >reference: "MARCH"</text>
<g class="p5"><g class="a6"><text x="1192" y="136" class="mono" font-size="14" font-weight="400" fill="#8C9DBA" text-anchor="end" >expected €1,000.00</text><text x="1192" y="158" class="mono" font-size="18" font-weight="700" fill="#F7776E" text-anchor="end" >−€70.00 ?</text></g></g>
<g class="a7"><text x="1192" y="136" class="mono" font-size="14" font-weight="400" fill="#8C9DBA" text-anchor="end" >every euro explained</text><text x="1192" y="158" class="mono" font-size="18" font-weight="700" fill="#4ADE80" text-anchor="end" >€70.00 ✓</text></g>
