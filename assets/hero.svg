<g class="a9"><text x="728" y="237" class="mono" font-size="15" font-weight="400" fill="#8C9DBA" text-anchor="start" >→ INV-101</text><text x="1192" y="237" class="mono" font-size="15" font-weight="600" fill="#4ADE80" text-anchor="end" >€600.00 ✓</text></g>
<g class="a10"><text x="728" y="264" class="mono" font-size="15" font-weight="400" fill="#8C9DBA" text-anchor="start" >→ INV-102</text><text x="1192" y="264" class="mono" font-size="15" font-weight="600" fill="#4ADE80" text-anchor="end" >€400.00 ✓</text></g>
<g class="a11"><text x="728" y="291" class="mono" font-size="15" font-weight="400" fill="#8C9DBA" text-anchor="start" >→ credit, late delivery</text><text x="1192" y="291" class="mono" font-size="15" font-weight="600" fill="#F6B94C" text-anchor="end" >−€50.00</text></g>
<g class="a12"><text x="728" y="318" class="mono" font-size="15" font-weight="400" fill="#8C9DBA" text-anchor="start" >→ bank fee on the way</text><text x="1192" y="318" class="mono" font-size="15" font-weight="600" fill="#F7776E" text-anchor="end" >−€20.00</text></g>
<g class="a13"><rect x="724" y="331" width="472" height="40" rx="10" fill="#4ADE80" fill-opacity=".12" stroke="#4ADE80" stroke-opacity=".6"/><text x="744" y="357" class="mono" font-size="17" font-weight="700" fill="#4ADE80" text-anchor="start" >= €930.00</text><text x="1176" y="357" class="sans" font-size="17" font-weight="700" fill="#4ADE80" text-anchor="end" >Reconciled ✓</text></g>
