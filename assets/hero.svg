<rect width="1280" height="440" rx="24" fill="url(#bg)"/>
<rect width="1280" height="440" rx="24" fill="url(#ledger)" opacity=".55"/>
<text x="64" y="92" class="mono" font-size="14" font-weight="600" fill="#8C9DBA" text-anchor="start" letter-spacing="1.5">AIRWALLEX AGENTIC BANKING HACKATHON · TREASURY &amp; OPS</text>
<text x="60" y="172" class="sans" font-size="72" font-weight="800" fill="#E7EEF8" text-anchor="start" >Receive to</text>
<text x="60" y="250" class="sans" font-size="72" font-weight="800" fill="url(#tealgrad)">Reconciled</text>
<text x="64" y="300" class="sans" font-size="22" font-weight="400" fill="#8C9DBA" text-anchor="start" >An agent that explains every short cross-border</text>
<text x="64" y="330" class="sans" font-size="22" font-weight="400" fill="#8C9DBA" text-anchor="start" >payment, then fixes why it happened. On Airwallex.</text>
